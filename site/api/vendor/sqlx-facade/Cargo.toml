[package]
name = "sqlx"
version = "0.8.6"
edition = "2021"
publish = false

[lib]
name = "sqlx"
path = "src/lib.rs"

[dependencies]
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "uuid", "migrate", "json"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["chrono", "uuid", "migrate", "json"] }
